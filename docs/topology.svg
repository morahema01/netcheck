<line x1="28" y1="548" x2="68" y2="548" stroke="#1f6feb" stroke-width="2.6"/><text x="76" y="552" font-size="13" fill="#1b1f24">Routed /30 link (OSPF)</text>
<line x1="250" y1="548" x2="290" y2="548" stroke="#c2560c" stroke-width="2.6"/><text x="298" y="552" font-size="13" fill="#1b1f24">802.1Q trunk (VLAN 10, 20)</text>
<text x="28" y="578" font-size="12" fill="#57606a">Every device also has a management port on 192.168.1.0/24 (last octet shown). NetCheck runs on a laptop and reaches all eight over SSH.</text>
