<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="NetCheck lab topology: one edge router, two core switches, two distribution switches and three access switches">
<rect width="980" height="600" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="28" y="76" font-size="15" font-weight="600" fill="#1b1f24">Edge</text>
<text x="28" y="94" font-size="12" fill="#57606a">default route source</text>
<text x="28" y="198" font-size="15" font-weight="600" fill="#1b1f24">Core</text>
<text x="28" y="216" font-size="12" fill="#57606a">routed links, OSPF area 0</text>
<text x="28" y="338" font-size="15" font-weight="600" fill="#1b1f24">Distribution</text>
<text x="28" y="356" font-size="12" fill="#57606a">HSRP, STP root, LACP</text>
<text x="28" y="478" font-size="15" font-weight="600" fill="#1b1f24">Access</text>
<text x="28" y="496" font-size="12" fill="#57606a">VLAN 10 users, VLAN 20 servers</text>
